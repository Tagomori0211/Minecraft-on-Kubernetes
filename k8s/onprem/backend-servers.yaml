# ============================================================
# TAK Pipeline - Backend Servers (MinecraftServer k3s)
# ============================================================
# オンプレ MinecraftServer ノードに展開するリソース
#
# コンポーネント:
#   Survival 統合サーバー (Helm Chart 管理 / values-survival.yaml)
#   Bedrock Server        : Bedrock Edition (4-8Gi)
#
# 接続フロー:
#   Java    : GCE socat-tcp(:25565) → Tailscale → svc-survival:30065
#   Bedrock : GCE socat-bedrock(:19132) → Tailscale → hostPort 19132
#   メトリクス: vmagent (monitoring-prometheus ns) → svc-*:8080 → GCE VictoriaMetrics
# ============================================================

# ── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/part-of: tak-pipeline
    location: onprem-minecraft-server

---
# ============================================================
# Bedrock カスタム Prometheus エクスポーター
# ============================================================
# GCE 入口 (35.200.78.252:19132) へ RakNet Unconnected Ping を送り、プレイヤー視点の
# 到達性を計測する。healthy は pong に MOTD(server-ID) があるか（=接続可能か）で判定し、
# responding / motd_present も個別に公開する（vmalert BedrockUnjoinableNoMOTD で使用）。
# 経緯: Documents/OperationPostmortem/postmortem-bedrock-motd-unjoinable.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-monitor-cm
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
data:
  monitor.py: |
    #!/usr/bin/env python3
    import glob, socket, struct, time, random, threading, os
    from http.server import HTTPServer, BaseHTTPRequestHandler

    MAGIC = b'\x00\xff\xff\x00\xfe\xfe\xfe\xfe\xfd\xfd\xfd\xfd\x12\x34\x56\x78'
    HOST = os.environ.get('PING_HOST', '35.200.78.252')
    PORT = int(os.environ.get('PING_PORT', 19132))
    INTERVAL, TIMEOUT = 15, 5
    DATA_DIR = '/data'

    def read_static_info():
        """max-players と BDS バージョンを server.properties / ファイル名からフォールバック取得。
        通常は正常 pong の MOTD から取得するが、取得不能時の補完に使う。"""
        max_players = 0
        version = ''
        try:
            with open(f'{DATA_DIR}/server.properties') as f:
                for line in f:
                    if line.startswith('max-players='):
                        max_players = int(line.split('=', 1)[1].strip())
        except (OSError, ValueError):
            pass
        try:
            # itzg wrapper が /data/bedrock_server-X.Y.Z.W を作成する
            matches = glob.glob(f'{DATA_DIR}/bedrock_server-*')
            if matches:
                version = matches[0].split('bedrock_server-', 1)[1]
        except Exception:
            pass
        return max_players, version

    _static_max_players, _static_version = read_static_info()

    _lock = threading.Lock()
    _state = {'healthy': 0, 'responding': 0, 'motd': 0, 'players': 0, 'rt': 0.0, 'version': ''}

    def ping():
        # 戻り値: responding(pong受信), motd_present(server-ID文字列あり=接続可), players, version, rt
        # 2026-06-21 障害: pong は返るが MOTD 欠落(level.dat LANBroadcast=0)で接続不能だった。
        #   「pongが返る=healthy」では検知できなかったため、healthy は MOTD 有無で判定する。
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(TIMEOUT)
        try:
            pkt = b'\x01' + struct.pack('>Q', int(time.time()*1000)) + MAGIC + struct.pack('>Q', random.getrandbits(64))
            t0 = time.monotonic()
            s.sendto(pkt, (HOST, PORT))
            data, _ = s.recvfrom(4096)
            elapsed = time.monotonic() - t0
            motd_present, players, version = 0, 0, ''
            if len(data) >= 35 and data[0] == 0x1c:
                slen = struct.unpack('>H', data[33:35])[0]
                if slen > 0 and len(data) >= 35 + slen:
                    parts = data[35:35+slen].decode('utf-8', errors='replace').split(';')
                    if len(parts) >= 6 and parts[0] in ('MCPE', 'MCEE'):
                        motd_present = 1
                        try: players = int(parts[4])
                        except (ValueError, IndexError): pass
                        version = parts[3] if len(parts) > 3 else ''
            return 1, motd_present, players, version, elapsed
        except socket.timeout:
            return 0, 0, 0, '', 0.0
        except Exception:
            return 0, 0, 0, '', 0.0
        finally:
            s.close()

    def loop():
        while True:
            responding, motd, players, version, rt = ping()
            with _lock:
                # healthy = 接続可能(=MOTDを広告できている)。MOTD欠落は unjoinable とみなし 0。
                _state.update({'healthy': motd, 'responding': responding, 'motd': motd,
                               'players': players, 'rt': rt, 'version': version or _static_version})
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != '/metrics':
                self.send_response(404); self.end_headers(); return
            with _lock:
                s = dict(_state)
            v = s.get('version') or _static_version
            lbl = f'server_edition="bedrock",server_host="{HOST}",server_port="{PORT}",server_version="{v}"'
            body = '\n'.join([
                '# HELP minecraft_status_healthy Joinable(1)=pongにMOTDあり / unjoinable(0)',
                '# TYPE minecraft_status_healthy gauge',
                f'minecraft_status_healthy{{{lbl}}} {s["healthy"]}',
                '# HELP minecraft_status_responding RakNetがpongを返すか(1/0)。MOTD有無は問わない',
                '# TYPE minecraft_status_responding gauge',
                f'minecraft_status_responding{{{lbl}}} {s["responding"]}',
                '# HELP minecraft_status_motd_present pongにserver-ID文字列(MOTD)があるか(1/0)',
                '# TYPE minecraft_status_motd_present gauge',
                f'minecraft_status_motd_present{{{lbl}}} {s["motd"]}',
                '# HELP minecraft_status_players_online_count Current online players',
                '# TYPE minecraft_status_players_online_count gauge',
                f'minecraft_status_players_online_count{{{lbl}}} {s["players"]}',
                '# HELP minecraft_status_players_max_count Maximum players',
                '# TYPE minecraft_status_players_max_count gauge',
                f'minecraft_status_players_max_count{{{lbl}}} {_static_max_players}',
                '# HELP minecraft_status_response_time_seconds Server response time in seconds',
                '# TYPE minecraft_status_response_time_seconds gauge',
                f'minecraft_status_response_time_seconds{{{lbl}}} {s["rt"]}',
            ]) + '\n'
            self.send_response(200)
            self.send_header('Content-Type', 'text/plain; version=0.0.4; charset=utf-8')
            self.end_headers()
            self.wfile.write(body.encode())
        def log_message(self, *a): pass

    threading.Thread(target=loop, daemon=True).start()
    print(f'bedrock-monitor :8080 -> {HOST}:{PORT} | version={_static_version} max_players={_static_max_players}')
    HTTPServer(('', 8080), Handler).serve_forever()

---
# ============================================================
# Bedrock Server (BDS)
# ============================================================
# GCE socat-bedrock (UDP 19132, fork 透過) → Tailscale → hostPort 19132
# (Documents/Mermaids/infrastructure.mermaid)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-bedrock
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mc-bedrock
        app.kubernetes.io/component: bedrock
      annotations:
        # mc-monitor が :8080 でメトリクスを公開する（19132/UDP ではない）
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        # ── Bedrock サーバー本体 ──────────────────────────────
        - name: bedrock
          image: itzg/minecraft-bedrock-server:latest
          env:
            - { name: EULA, value: "TRUE" }
            - { name: TZ, value: "Asia/Tokyo" }
            - { name: ONLINE_MODE, value: "false" }
            - { name: SERVER_NAME, value: "Sushi.ski-Server" }
            - { name: GAMEMODE, value: "survival" }
            - { name: FORCE_GAMEMODE, value: "true" }
            - { name: DIFFICULTY, value: "easy" }
            - { name: ALLOW_CHEATS, value: "true" }
            - { name: MAX_PLAYERS, value: "25" }
            - { name: ALLOW_LIST, value: "false" }
            - { name: LEVEL_NAME, value: "sushi_server" }   # 2026-08-26 sushi.zip からリストアしワールド切替
            - { name: VIEW_DISTANCE, value: "48" }            # 過大値。トンネル越し前提では 12 程度推奨
            - { name: TICK_DISTANCE, value: "8" }
            - { name: PLAYER_IDLE_TIMEOUT, value: "30" }
            # RAKNET_FORCE_MTU は itzg 非対応の no-op だったため削除（2026-06-21）
            - { name: DISABLE_CLIENT_VIBRANT_VISUALS, value: "false" }
          ports:
            - containerPort: 19132
              hostPort: 19132
              name: bedrock
              protocol: UDP
          # send-command（/list・say・stop）は /proc/*/exe を読んでサーバープロセスを探す。
          # サーバーは uid 1000 で動き、kubectl exec は root で入るため、別 uid の /proc/<pid>/exe を
          # 読むには CAP_SYS_PTRACE が要る（無いと "failed to search for bedrock server process"）。
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          volumeMounts:
            - mountPath: /data
              name: data
          resources:
            requests: { memory: "4Gi", cpu: "4" }
            limits: { memory: "8Gi", cpu: "8" }
        # Probes removed due to missing mc-monitor binary in bedrock image

        # ── カスタム Bedrock モニター（Prometheus Exporter）────────
        # NOTE(2026-06-21): 「MOTDなし最小Pong は BDS1.26.x 仕様」は誤認だった。
        #   実際は level.dat の LANBroadcast=0 によるワールド固有バグで、Bedrock 接続不可の真因。
        #   修正済み → Documents/OperationPostmortem/postmortem-bedrock-motd-unjoinable.md
        #   旧版はMOTDなしでも healthy=1 を返し当該障害を17h検知できなかったため、
        #   healthy を MOTD 有無で判定するよう改修し、vmalert に BedrockUnjoinableNoMOTD を追加済み。
        - name: mc-monitor
          image: python:3.12-alpine
          command: ["python3", "/scripts/monitor.py"]
          env:
            - { name: PING_HOST, value: "35.200.78.252" }
            - { name: PING_PORT, value: "19132" }
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: bedrock-monitor-script
              mountPath: /scripts
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests: { memory: "32Mi", cpu: "10m" }
            limits: { memory: "64Mi", cpu: "100m" }

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-bedrock
        - name: bedrock-monitor-script
          configMap:
            name: bedrock-monitor-cm

---
apiVersion: v1
kind: Service
metadata:
  name: svc-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  selector:
    app: mc-bedrock
  type: ClusterIP
  ports:
    - port: 19132
      name: bedrock
      protocol: UDP
    - port: 8080
      name: metrics
