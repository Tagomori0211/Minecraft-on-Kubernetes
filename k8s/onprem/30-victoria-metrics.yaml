# ============================================================
# TAK Pipeline - vmagent (オンプレ k3s)
# ============================================================
# VictoriaMetrics と Grafana は GCE mc-gateway（統合 VM）で動く。
# vmagent のみ k3s 内に残し:
#   - Kubernetes サービスディスカバリ（nodes / cAdvisor）
#   - Minecraft メトリクスのスクレイプ（ClusterIP DNS 名）
#   - remote_write で GCE VictoriaMetrics に転送
#
# remote_write 先: mc-gateway の Tailscale IP = 100.105.149.22
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-prometheus
  labels:
    app.kubernetes.io/name: "monitoring-prometheus"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"

---
# ============================================================
# vmagent スクレイプ設定
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-cm
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: "vmagent"
    app.kubernetes.io/component: "monitoring"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"
data:
  vmagent.yml: |-
    global:
      scrape_interval: 1s

    scrape_configs:
      # ── Minecraft サーバー（ClusterIP DNS 名）─────────────────
      # Java(survival) は休眠中（2026-09-30 に Deployment 削除・PVC 保持）のため bedrock のみ。
      # 再開時は survival ジョブ（svc-survival.minecraft.svc.cluster.local:8080）を戻す。
      - job_name: 'bedrock'
        static_configs:
          - targets: ['svc-bedrock.minecraft.svc.cluster.local:8080']
            labels: { location: onprem, component: bedrock }

      # ── cAdvisor ──────────────────────────────────────────
      # kubelet 自体の指標（旧 kubernetes-nodes ジョブ、約 3.7 万系列）は
      # どのダッシュボード・アラートからも参照されていないため収集しない。
      - job_name: 'kubernetes-cadvisor'
        scrape_interval: 30s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - target_label: location
            replacement: onprem
        # 参照されている系列だけを残す（Grafana ダッシュボード / Status Platform の API）。
        # 収集先 VM（e2-micro）の負荷を抑えるため、他 namespace のコンテナ系列は送らない。
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_fs_usage_bytes|container_fs_limit_bytes|container_spec_memory_limit_bytes|container_start_time_seconds|machine_cpu_cores|machine_memory_bytes
            action: keep
          # machine_* / ノード全体（id="/"）/ minecraft namespace のみ
          - source_labels: [__name__, id, namespace]
            separator: ;
            regex: machine_.*;.*;.*|[^;]+;/;.*|[^;]+;[^;]*;minecraft
            action: keep

---
# ============================================================
# vmagent 用 ServiceAccount / RBAC
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-sa
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: "vmagent"
    app.kubernetes.io/component: "monitoring"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-sa-clusterrole
  labels:
    app.kubernetes.io/name: "vmagent"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-sa-clusterrolebinding
  labels:
    app.kubernetes.io/name: "vmagent"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-sa-clusterrole
subjects:
  - kind: ServiceAccount
    name: vm-sa
    namespace: monitoring-prometheus

---
# ============================================================
# vmagent Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: "vmagent"
    app.kubernetes.io/component: "monitoring"
    app.kubernetes.io/managed-by: "kubectl"
    env: "prod"
spec:
  replicas: 1
  # 旧 Pod を止めてから新 Pod を作る（新旧 Pod を並走させない）
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: "vmagent"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "vmagent"
    spec:
      serviceAccountName: vm-sa
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.115.0
          args:
            - "-promscrape.config=/etc/vmagent/vmagent.yml"
            - "-remoteWrite.url=http://100.105.149.22:8428/api/v1/write"
            - "-promscrape.suppressDuplicateScrapeTargetErrors"
            - "-remoteWrite.queues=2"
          volumeMounts:
            - name: vmagent-config
              mountPath: /etc/vmagent/
            - name: vmagent-wal
              mountPath: /tmp/vmagent-wal
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits:   { memory: "256Mi", cpu: "500m" }
      volumes:
        - name: vmagent-config
          configMap:
            name: vmagent-cm
        - name: vmagent-wal
          emptyDir: {}
