# ============================================================
# Vector DaemonSet - Minecraft ログ収集 → VictoriaLogs
# ============================================================
# minecraft namespace の全 Pod ログを /var/log/pods/ から収集し
# mc-gateway（Tailscale 100.105.149.22）の VictoriaLogs へ直接送る。
#
# ログフロー:
#   /var/log/pods/minecraft_*/  (hostPath)
#     → Vector kubernetes_logs source
#     → flatten_meta transform  (ラベル整理)
#     → loki sink: http://100.105.149.22:9428/insert/loki/api/v1/push  (Tailscale)
#     → VictoriaLogs
#
# 既存の mc-log-shipper (Pub/Sub → BigQuery) とは独立。
# 全文ログ検索・エラー監視を VictoriaLogs で追加提供する。
# ============================================================

# ── ServiceAccount ───────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/managed-by: kubectl
    env: prod

---
# ── ClusterRole ──────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/managed-by: kubectl
    env: prod
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]

---
# ── ClusterRoleBinding ───────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/managed-by: kubectl
    env: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: monitoring-prometheus

---
# ── ConfigMap (Vector 設定) ──────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/managed-by: kubectl
    env: prod
data:
  vector.yaml: |
    sources:
      kubernetes_logs:
        type: kubernetes_logs
        # minecraft namespace のみ収集（他のシステムログを除外）
        # Vector 0.56 では include_namespaces は無効。namespace 組込ラベルで絞る。
        extra_namespace_label_selector: "kubernetes.io/metadata.name=minecraft"
        timezone: Asia/Tokyo

    transforms:
      flatten_meta:
        type: remap
        inputs: [kubernetes_logs]
        source: |-
          # Loki ラベル用にメタデータをトップレベルフィールドへ展開
          # app.kubernetes.io/component ラベルを job として使用
          .job = get(.kubernetes.pod_labels, ["app.kubernetes.io/component"]) ?? "unknown"
          # フィールドアクセスは欠損時 null を返し error しないため ?? でなく || で既定値
          .log_container = .kubernetes.container_name || "unknown"
          .log_namespace = .kubernetes.pod_namespace || "unknown"
          .log_pod = .kubernetes.pod_name || "unknown"

    sinks:
      victorialogs:
        type: loki
        inputs: [flatten_meta]
        # mc-gateway の VictoriaLogs（Loki 互換 API）。Vector は endpoint + /loki/api/v1/push に POST する
        endpoint: "http://100.105.149.22:9428/insert"
        labels:
          job: "{{ job }}"
          container: "{{ log_container }}"
          namespace: "{{ log_namespace }}"
          pod: "{{ log_pod }}"
        encoding:
          codec: text
        compression: none
        request:
          concurrency: 4
        buffer:
          type: memory
          max_events: 10000
          # VictoriaLogs が一時停止してもデータロスを最小化
          when_full: drop_newest

---
# ── DaemonSet ────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: monitoring-prometheus
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/managed-by: kubectl
    env: prod
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/component: log-collector
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 60
      containers:
        - name: vector
          image: timberio/vector:0.56.0-debian
          args: ["--config", "/etc/vector/vector.yaml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-docker
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-docker
          hostPath:
            path: /var/lib/docker/containers
