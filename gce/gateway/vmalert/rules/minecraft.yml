groups:
  - name: minecraft-infra
    # vmalert が VictoriaMetrics(:8428) に対して評価し、発火を Alertmanager へ送る
    rules:
      # ── オンプレ沈黙（旧 healthcheck コンテナの置き換え）──
      - alert: OnpremSilence
        expr: absent(up{location="onprem"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "オンプレ k3s 沈黙を検知"
          description: "5分以上 onprem メトリクスが途絶しています（vmagent / k3s / Tailscale 障害の可能性）。"

      # ── Minecraft サーバー異常 ──
      - alert: MinecraftServerDown
        expr: minecraft_status_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Minecraft {{ $labels.component }} が unhealthy"
          description: "{{ $labels.component }} が5分以上 healthy=0（バックアップ等の計画停止を除き要確認）。"

      # ── Bedrock 接続不能（pongは返るが MOTD欠落）──
      #    2026-06-21 障害(level.dat LANBroadcast=0)の再発検知。healthy==0 でも拾えるが
      #    「応答あり×MOTD無し＝接続不能」という原因を即断できるよう専用化。
      #    ※ minecraft_status_responding / _motd_present は改修後の自作エクスポーターが出力。
      - alert: BedrockUnjoinableNoMOTD
        expr: minecraft_status_responding == 1 and minecraft_status_motd_present == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Bedrock が応答するが MOTD未広告（接続不能）"
          description: "RakNet応答はあるが offline-ping に MOTD が無く、クライアントが接続できません。world の level.dat で LANBroadcast / MultiplayerGameIntent を確認（Documents/OperationPostmortem/postmortem-bedrock-motd-unjoinable.md）。"

      # ── scrape ターゲット停止 ──
      - alert: ScrapeTargetDown
        expr: up{location="onprem"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "scrape ターゲット down: {{ $labels.job }}"
          description: "{{ $labels.instance }} ({{ $labels.job }}) の scrape が5分以上失敗しています。"

      # ── Tailscale auth-key 失効間近 ──
      # ⚠️ 鍵ローテ時は下記 epoch を更新（発行+80日 = 失効10日前）。
      #    2026-06-19 発行 / 90日失効 → 1788739200 (2026-09-07) で発火。
      # ℹ️ 鍵ローテは手動運用のため Discord 通知は抑止済み（alertmanager.yml の
      #    'null' receiver ルート）。アラート自体は Alertmanager UI に残る。
      - alert: TailscaleAuthKeyExpiringSoon
        expr: time() > 1788739200
        labels:
          severity: warning
        annotations:
          summary: "Tailscale auth-key 失効間近（発行+80日経過）"
          description: "Secret Manager tailscale-auth-key を再ローテしてください。失効すると autoheal/再作成インスタンスが Tailscale に参加できず入口が停止します。"
