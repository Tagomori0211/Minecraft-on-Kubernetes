# ============================================================
# Alertmanager 設定（vmalert → Alertmanager → Discord）
# ============================================================
# Alertmanager v0.25+ のネイティブ discord_configs で通知する（ブリッジ不要）。
# webhook URL は機密のため webhook_url_file（v0.26+）で渡す。ファイルは cloud-init が
# Secret Manager の mc-discord-webhook-url から /opt/mc-gateway/secrets/discord_webhook に生成する。
# ============================================================
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Tailscale auth-key ローテは手動運用（Secret Manager を人手で再発行）のため、
    # 期限接近アラートは Alertmanager UI 上には残しつつ Discord 通知は抑止する。
    # 鍵ローテ時は vmalert/rules/minecraft.yml の epoch を更新すること。
    - matchers:
        - alertname="TailscaleAuthKeyExpiringSoon"
      receiver: 'null'

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/discord_webhook
        send_resolved: true
  # 通知を出さない受信先（Discord 抑止用）
  - name: 'null'
