# mc-proxy ホストメトリクス収集（node-exporter → vmagent → mc-monitoring VictoriaMetrics）
# MIG 再作成で Tailscale IP が変わるため push（remote_write）型で収集する。
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: mc-proxy
          role: entrance
          machine_type: e2-micro
